# Table 9, RoBERTa-base LoRA block. Column order in the paper: MNLI SST-2 MRPC CoLA QNLI QQP RTE STS-B.
hyperparameters_table9_base:
  optimizer: AdamW
  warmup_ratio: 0.06
  lr_schedule: linear
  lora_rank: {q: 8, v: 8}
  lora_alpha: 8
  max_seq_len: 512
  per_task:
    MNLI: {batch_size: 16, epochs: 30, lr: 5.0e-4}
    SST-2: {batch_size: 16, epochs: 60, lr: 5.0e-4}
    MRPC: {batch_size: 16, epochs: 30, lr: 4.0e-4}
    CoLA: {batch_size: 32, epochs: 80, lr: 4.0e-4}
    QNLI: {batch_size: 32, epochs: 25, lr: 4.0e-4}
    QQP: {batch_size: 16, epochs: 25, lr: 5.0e-4}
    RTE: {batch_size: 32, epochs: 80, lr: 5.0e-4}
    STS-B: {batch_size: 16, epochs: 40, lr: 4.0e-4}

# Liu et al. (2019), Table 10 and Section 5.1 (fine-tuning recipe used for the FT baseline).
liu2019_finetuning:
  lr_grid: [1.0e-5, 2.0e-5, 3.0e-5]
  batch_size_grid: [16, 32]
  weight_decay: 0.1
  max_epochs: 10
  warmup_ratio: 0.06
  lr_schedule: linear
  selection: "early stopping on dev metric; median over 5 seeds"
  rest_from_pretraining: {adam_beta1: 0.9, adam_beta2: 0.98, adam_eps: 1.0e-6, dropout: 0.1}
