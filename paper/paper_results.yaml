# Numbers transcribed from Hu et al. (2021), arXiv 2106.09685.
# Verified against the PDF text by scripts/verify_paper_numbers.py.
source:
  paper: "LoRA: Low-Rank Adaptation of Large Language Models"
  arxiv: "2106.09685"
  table: "Table 2 (RoBERTa-base rows); protocol from Appendix D.1"
  ft_origin: "Fine-tuning row is quoted from Liu et al. (2019), arXiv 1907.11692, Table 8 (dev set)"

protocol:
  statistic: median            # "We report the median over 5 random seeds" (Appendix D.1)
  seeds: 5
  epoch_selection: best_epoch  # "the result for each run is taken from the best epoch"
  # The paper does not state the evaluation split in the RoBERTa section.
  # The FT row equals the dev-set numbers of Liu et al., Table 8.
  dagger_rows_for_base: false  # Table 2 has dagger rows for RoBERTa-large only
  mnli_start_for: [MRPC, RTE, STS-B]  # LoRA modules initialised from best MNLI checkpoint (Appendix D.1)

metrics:
  SST-2: accuracy
  RTE: accuracy
  MRPC: accuracy
  CoLA: matthews_correlation
  STS-B: pearson_correlation

# Table 2, RoBERTa-base. value = reported number, std = value after the plus-minus sign
# (absent if the row has none). Columns outside the project scope are kept for completeness.
